[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-include-trace"
version = "0.1.0"
description = "Offline captured-input analysis with explicit evidence and bounded contracts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.scripts]
matrix-include-trace = "matrix_include_trace:main"

[tool.setuptools]
py-modules = ["matrix_include_trace"]
